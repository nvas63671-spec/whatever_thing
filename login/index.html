<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tester Login</title>
<style>
  :root {
    --lavender-background: #E6E0F8;
    --purple-dark: #3B1A7A;
    --purple-primary: #6200EE;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--lavender-background);
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
    overflow-y: auto;
  }
  .screen {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .form { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
  .icon { width: 120px; height: 120px; }
  h1 {
    margin: 16px 0 32px;
    font-size: 32px;
    font-weight: bold;
    color: var(--purple-dark);
  }
  .field { position: relative; width: 100%; background: var(--white); border-radius: 4px; }
  .field + .field { margin-top: 16px; }
  .field input {
    width: 100%;
    height: 56px;
    padding: 20px 48px 6px 14px;
    font-size: 16px;
    border: 1px solid #79747E;
    border-radius: 4px;
    background: transparent;
    outline: none;
  }
  .field label {
    position: absolute;
    left: 14px;
    top: 17px;
    font-size: 16px;
    color: #6b6b6b;
    pointer-events: none;
    transition: all .15s ease;
  }
  .field input:focus,
  .field input:not(:placeholder-shown) { }
  .field input:focus { border: 2px solid var(--purple-primary); padding: 19px 47px 5px 13px; }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label { top: 6px; font-size: 12px; }
  .field input:focus + label { color: var(--purple-primary); }
  .toggle {
    position: absolute;
    right: 8px;
    top: 8px;
    width: 40px;
    height: 40px;
    border: 0;
    background: transparent;
    cursor: pointer;
    color: var(--purple-primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toggle svg { width: 24px; height: 24px; fill: currentColor; }
  .toggle .off { display: none; }
  .toggle.showing .on { display: none; }
  .toggle.showing .off { display: block; }
  button.login {
    width: 100%;
    height: 56px;
    margin-top: 32px;
    border: 0;
    border-radius: 28px;
    background: var(--purple-primary);
    color: var(--white);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: .5px;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  button.login:hover { filter: brightness(1.1); }
  button.login:active { filter: brightness(.9); }
</style>
</head>
<body>
  <div class="screen">
    <form class="form" id="login_id">
      <svg class="icon" viewBox="0 0 24 24" role="img" aria-label="User icon" fill="#000">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
 
      <h1>Tester</h1>
 
      <div class="field">
        <input id="etUsername" name="username" type="text" placeholder=" " autocomplete="username">
        <label for="etUsername">Username</label>
      </div>
 
      <div class="field">
        <input id="etPassword" name="password" type="password" placeholder=" " autocomplete="current-password">
        <label for="etPassword">Password</label>
        <button type="button" class="toggle" id="togglePw" aria-label="Toggle password visibility">
          <svg class="on" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
        </button>
      </div>
 
      <button type="submit" class="login" id="btnLogin">Login</button>
    </form>
  </div>
        
 <script script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"> </script>
<script src="js/index.js" type="text/javascript"></script>

<script>
  var pw = document.getElementById('etPassword');
  var tg = document.getElementById('togglePw');
  tg.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    tg.classList.toggle('showing', show);
  });
</script>
</body>
</html>
